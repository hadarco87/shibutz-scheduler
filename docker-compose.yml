services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shibutz
      POSTGRES_PASSWORD: shibutz
      POSTGRES_DB: shibutz
    volumes:
      - shibutz_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shibutz -d shibutz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SEED_DEMO: "false"
      SECRET_KEY: change-me-to-a-long-random-string
      DATABASE_URL: postgresql+psycopg://shibutz:shibutz@db:5432/shibutz
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  shibutz_pg:
